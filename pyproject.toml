[project]
name = "tartanadvisor"
version = "0.1.0"
description = "TartanAdvisor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0",
]

[project.scripts]
kickoff = "tartanadvisor.main:kickoff"
run_crew = "tartanadvisor.main:kickoff"
plot = "tartanadvisor.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
